name: 同步上游仓库（已改为手动触发）

permissions:
  contents: write

on:
  # ⛔ 已停用每日自动合并（原为 schedule: "0 0 * * *"）。
  #
  # 原因：上游 yutian81/domain-check 是「公开页（脱敏）+ /admin 管理页」的双模式实现，
  # 与本 fork 的「单模式 + 永久域名（isPermanent）」定制不兼容。自动合并会在无冲突提示的
  # 情况下静默破坏本地定制——2026-09-26 修复的内联脚本语法错误
  # （丢失 `if (IS_ADMIN) {`、重复代码块、多余 `}`）就是这类合并残留造成的。
  #
  # 如需同步上游：手动触发本 workflow，并逐个文件 review 差异后再决定是否合并。
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    name: 同步上游仓库
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 同步上游仓库
        id: sync
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4
        with:
          upstream_sync_repo: yutian81/domain-check
          upstream_sync_branch: main
          target_sync_branch: main
          target_repo_token: ${{ secrets.GITHUB_TOKEN }} # 无需设置
          # test_mode: true 只演练不推送，确认差异符合预期后再改为 false
          test_mode: false

      - name: 检查同步状态
        if: failure()
        run: |
          echo "[Error] 由于上游仓库的 workflow 文件变更，导致 GitHub 自动暂停了本次自动更新，你需要手动 Sync Fork 一次"
          echo "[Error] Due to changes in the workflow file of the upstream repository, GitHub has automatically paused this automatic update. You need to manually Sync Fork once"
          exit 1
