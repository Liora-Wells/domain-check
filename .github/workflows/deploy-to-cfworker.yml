name: 自动部署到 CF Worker

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'frontend/**'
      - 'wrangler.toml'
  workflow_dispatch:

jobs:
  auto-deploy:
    runs-on: ubuntu-latest
    env:
      PASSWORD: ${{ secrets.PASSWORD }}
      TGID: ${{ secrets.TGID}}
      TGTOKEN: ${{ secrets.TGTOKEN}}
      CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
      CF_KV_ID: ${{ secrets.CF_KV_ID }}
      CF_CRONS: ${{ vars.CF_CRONS || '0 1,13 * * *' }}

    steps:
      - name: ⬇️ 检出仓库
        uses: actions/checkout@v4

      - name: 🛠️ 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 🆙 更新并安装最新 Wrangler
        run: npm install -g wrangler@latest

      - name: 🔄 替换 wrangler.toml 中的变量
        id: config_setup
        run: |
          [ -n "${CF_KV_ID}" ] || { echo "🔴 错误: 必须设置 'CF_KV_ID' 变量"; exit 1; }
          sed -i "s#{CF_KV_ID}#${CF_KV_ID}#g" wrangler.toml
          sed -i "s#{CF_CRONS}#${CF_CRONS}#g" wrangler.toml

          WORKER_NAME=$(grep '^name =' wrangler.toml | awk -F '"' '{print $2}')
          [ -n "$WORKER_NAME" ] || { echo "🔴 错误: 未能在 wrangler.toml 中找到 'name' 字段"; exit 1; }

          echo -e "\n🎉 项目配置信息如下:"
          echo "-------------------"
          cat wrangler.toml
          echo "-------------------"
          echo "worker_name=$WORKER_NAME" >> $GITHUB_OUTPUT

      - name: ⚙️ 动态配置 Worker 环境变量
        id: dynamic_vars
        run: |
          VARS=""

          # —— PASSWORD：未设置时行为不变（仍用默认 123123），但必须显著告警 ——
          if [ -n "$PASSWORD" ]; then
            VARS+="PASSWORD"$'\n'
          else
            echo "::warning title=未设置 PASSWORD::GitHub Secret 中未配置 PASSWORD，本次部署将使用公开的默认密码 123123 保护站点，任何人都可以用它登录管理面板。"
            {
              echo "## ⚠️ 安全提醒：未设置 \`PASSWORD\`"
              echo ""
              echo "本次部署使用的是**公开的默认密码 \`123123\`**，任何人都可以用它登录你的管理面板，并增删改你的域名数据。"
              echo ""
              echo "**修复方式**：仓库 \`Settings → Secrets and variables → Actions\` → \`New repository secret\`，名称填 \`PASSWORD\`，值填你自己的密码，然后重新运行本 workflow。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # —— Telegram 通知变量 ——
          if [ -n "$TGID" ] && [ -n "$TGTOKEN" ]; then
            VARS+="TGID"$'\n'"TGTOKEN"$'\n'
          else
            echo "::warning title=未设置 TG 通知变量::TGID / TGTOKEN 未配置，域名到期提醒将不会推送到 Telegram。"
          fi

          # —— /cron 可选令牌保护 ——
          if [ -n "$CRON_TOKEN" ]; then
            VARS+="CRON_TOKEN"$'\n'
            echo "::notice title=/cron 已启用令牌保护::调用 /cron 需携带 ?token=xxx 或 X-Cron-Token 头。"
          else
            echo "::notice title=/cron 未启用令牌保护::未配置 CRON_TOKEN，/cron 手动触发接口保持免鉴权（与 API.md 一致）。如需保护，请添加同名 Secret。"
          fi

          printf 'vars_list<<EOF\n%sEOF\n' "$VARS" >>"$GITHUB_OUTPUT"

          if [ -n "$VARS" ]; then
            echo -e "\n✅ 传递给 Wrangler 的环境变量名:"
            printf '%s' "$VARS"
          else
            echo -e "\n⚠️ 没有需要传递的变量名"
          fi

      - name: 🚀 部署到 CF Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ vars.CF_ACCOUNT_ID }}
          vars: ${{ steps.dynamic_vars.outputs.vars_list }}

      - name: ✨ 输出 Worker 管理后台
        env:
          WORKER_NAME: ${{ steps.config_setup.outputs.worker_name }}
          ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: |
          echo -e "\n✨✨✨ 部署完成 ✨✨✨"
          echo "🌐 点击以下链接可访问项目管理后台"
          echo "https://dash.cloudflare.com/${ACCOUNT_ID}/workers/services/view/${WORKER_NAME}/production/settings"
          echo "🚀 建议: 给项目绑定一个自定义域名"
